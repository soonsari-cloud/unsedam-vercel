function tarotDetails(card,i,three){const pos=(three?['현재 상황','돌아볼 점','가능한 행동']:['오늘의 질문'])[i]||'카드';return {name:TAROT_NAMES[card.index],symbol:TAROT_SIGNS[card.index],position:pos,mode:card.reversed?'역방향':'정방향',interpret:card.reversed?`「${TAROT_LINES[card.index]}」라는 주제를 충분히 살펴볼 시간을 가져 보세요.`:`「${TAROT_LINES[card.index]}」에 주목해 보세요.`,action:TAROT_ACTIONS[card.index]};}

function tarot(){const isRead=!!reading;const count=isRead?reading.cards.length:0;const allOpened=isRead&&reading.revealed.length===reading.cards.length;return `${pageHead('tarot')}<section class="panel form-panel"><div class="panel-head"><h2>지금 떠오르는 질문이 있나요?</h2><p>정답을 맞히기보다 생각을 정리하는 카드 놀이입니다.</p></div>${isRead?`<div class="tarot-toolbar"><div><span class="small-up">이번 회차</span><div class="tiny-mono">${escapeHtml(reading.createdAt.slice(0,16).replace('T',' '))} · 메이저 22장</div></div><button class="secondary" data-action="newTarot">새로 뽑기</button></div><div class="tarot-row ${count===3?'three':''}">${reading.cards.map((c,i)=>tarotCard(c,i,count===3)).join('')}</div>${!allOpened?`<button class="outline full" type="button" data-action="revealAll">모든 카드 공개하기</button>`:`<div class="tarot-finish"><h3>카드가 건네는 오늘의 말</h3><p>선택하신 카드는 미래를 결정하지 않습니다. 생각을 정리하는 도구로 활용해 보세요.</p><div class="action-buttons"><button class="primary" type="button" data-action="tarotSave">이 해석 저장하기</button><button class="outline" type="button" data-action="tarotShare">공유 미리보기</button></div></div>`}`:`<label class="field" for="tarotQuestion"><span class="field-label">마음속 질문 <span class="optional">선택</span></span><textarea id="tarotQuestion" rows="3" maxlength="120" placeholder="예: 새로운 일을 시작해도 될까요?">${escapeHtml(state.tarotQuestion)}</textarea></label><div class="tarot-choice"><button class="primary" type="button" data-draw="1"><span>✦</span> 한 장 뽑기 <small>오늘의 시선</small></button><button class="secondary dark" type="button" data-draw="3"><span>✦✦✦</span> 세 장 뽑기 <small>현재 · 성찰 · 행동</small></button></div><div class="tarot-ornament"><span>☾</span> &nbsp; 나를 이해하는 카드 한 장 &nbsp; <span>✦</span></div>`}</section><div class="notice"><strong>타로 이용 안내</strong><p>메이저 아르카나 22장 중 중복 없이 뽑습니다. 정방향·역방향은 각각 약 50%입니다. 이번 회차는 탭을 닫을 때까지 저장되며, 새로운 카드를 누르면 새 회차로 바뀝니다.</p></div>`;}
function hashString(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function todaysItem(){const date=toDateKey(state.timezone);return {date,item:TODAY_ITEMS[hashString(date+'|'+TODAY_VERSION)%TODAY_ITEMS.length]};}
function today(){const {date,item}=todaysItem();return `${pageHead('today')}<section class="day-panel"><span class="day-badge">${escapeHtml(date)} · 공통 오늘의 메시지</span><div class="daily-symbol">☼</div><div class="eyebrow">TODAY'S NOTE</div><h2>${item.topic}</h2><p class="day-intro">${item.intro}</p><div class="day-divider">✦ &nbsp; ✧ &nbsp; ✦</div><div class="daily-grid"><div><span>♡ 관계</span><p>${item.relation}</p></div><div><span>◇ 일과 공부</span><p>${item.work}</p></div><div><span>▧ 돈 관리</span><p>${item.money}</p></div><div><span>☾ 생활 리듬</span><p>${item.rhythm}</p></div></div><div class="day-action"><span>오늘의 작은 실천</span><strong>${item.action}</strong></div><div class="action-buttons"><button class="primary" data-action="todaySave">메시지 저장</button><button class="outline" data-action="todayShare">공유 미리보기</button></div></section><div class="notice"><strong>오늘의 메시지 기준</strong><p>${escapeHtml(state.timezone)} 날짜에 따라 선택되는 공통 자기성찰 문장입니다. 생년월일을 계산한 개인 운세나 검증된 미래 예측이 아니며, 같은 날짜에는 같은 문장이 표시됩니다.</p></div>`;}
function renderSajuSpecial(result){if(result.type!=='saju')return '';const d=result.extra;return `<section class="saju-board"><div class="board-head"><h3>사주의 네 기둥</h3><small>계산 결과 · 한국 표준 시계 시각 기준</small></div><div class="pillars">${[['year','년주','태어난 해'],['month','월주','절기 기준 달'],['day','일주','태어난 날'],['hour','시주','태어난 시간']].map(([k,t,sub])=>{const p=d.pillars[k];return `<div class="pillar"><span class="pillar-title">${t}</span><strong>${p?p.text:'미상'}</strong><small>${sub}</small></div>`;}).join('')}</div><div class="board-head compact"><h3>오행의 구성</h3><small>확인된 ${d.observedCount}개 글자의 단순 개수</small></div><div class="element-bars">${Object.entries(d.counts).map(([name,n])=>`<div class="element-row"><span>${name}</span><div class="bar-track"><div class="bar-fill bar-${name}" style="width:${d.observedCount?Math.round(100*n/d.observedCount):0}%"></div></div><strong>${n}개</strong></div>`).join('')}</div><p class="board-note">오행의 개수는 해당 글자를 세는 방식이며, 기운의 강약이나 성격·운명에 대한 과학적 측정값이 아닙니다.</p>${d.uncertainties.length?`<div class="uncertainty"><strong>확인할 점</strong>${d.uncertainties.map(s=>`<p>• ${escapeHtml(s)}</p>`).join('')}</div>`:''}<details><summary>계산 기준 자세히 보기</summary><p>연주: 입춘 경계 · 월주: 12절기 절입 경계 · 일주: 자정에 변경 · 시주: 2시간 구간(생시 확인 시만 표시) · 진태양시 미적용. 한국 음력 윤달은 별도로 변환합니다.</p><p>계산 규칙: ${escapeHtml(d.rulesVersion)} · ${escapeHtml(result.meta||'')}</p></details></section>`;}
function resultView(){const r=state.result;if(!r)return home();return `<button class="back" data-action="again">← 다시 살펴보기</button><section class="result-hero">${smallLabel('YOUR REFLECTION')}<div class="result-icon">${icon(r.type)}</div><span class="result-type">${SERVICE[r.type].name} · ${r.method||'기본 해석'}</span><h1>${escapeHtml(r.title)}</h1><p>${escapeHtml(r.summary)}</p><small>전통적 해석을 바탕으로 한 자기이해 콘텐츠입니다.</small></section>${renderSajuSpecial(r)}<section class="panel result-sections"><div class="section-head tight"><div>${smallLabel('INSIGHT')}<h2>나를 위한 이야기</h2></div></div>${r.sections.map((s,i)=>`<div class="interpret-line"><span class="interpret-index">${String(i+1).padStart(2,'0')}</span><div><h3>${escapeHtml(s.title)}</h3><p>${escapeHtml(s.text)}</p></div></div>`).join('')}<div class="practice"><span>오늘의 작은 실천</span><strong>${escapeHtml(r.action)}</strong></div></section><section class="result-actions"><button class="primary" data-action="saveResult">이 결과 저장하기</button><button class="outline" data-action="shareResult">공유 미리보기</button><button class="text-btn" data-action="again">새로운 이야기 보기 ↗</button></section>`;}
function recordList(){let r=savedRecords.find(x=>x.id===state.detailRecordId);return `${smallLabel('MY JOURNAL')}<h1 class="plain-title">나의 기록 <span>${savedRecords.length}</span></h1><p class="lead">직접 저장한 이야기만 이 기기에 남습니다.</p>${r?`<div class="record-detail"><button class="back" data-action="backRecords">← 기록 목록으로</button><div class="panel"><span class="record-kicker">${SERVICE[r.result.type]?.name||'기록'} · ${escapeHtml(r.savedAt.slice(0,10))}</span><h2>${escapeHtml(r.result.title)}</h2><p class="result-record-summary">${escapeHtml(r.result.summary)}</p>${renderSajuSpecial(r.result)}${r.result.sections.map(s=>`<h3>${escapeHtml(s.title)}</h3><p>${escapeHtml(s.text)}</p>`).join('')}<div class="practice"><span>작은 실천</span><strong>${escapeHtml(r.result.action)}</strong></div><div class="action-buttons"><button class="outline" data-action="recordShare">공유 미리보기</button><button class="danger-outline" data-delete="${escapeHtml(r.id)}">이 기록 삭제</button></div></div></div>`:savedRecords.length?`<div class="record-items">${savedRecords.map(x=>`<article class="record-item"><button data-open="${escapeHtml(x.id)}"><span class="record-type">${icon(x.result.type)} ${SERVICE[x.result.type]?.name||'기록'}</span><h2>${escapeHtml(x.result.title)}</h2><p>${escapeHtml(x.result.summary)}</p><small>${escapeHtml(x.savedAt.slice(0,10))} 저장</small><span class="record-arrow">→</span></button><button class="record-delete" data-delete="${escapeHtml(x.id)}" aria-label="${escapeHtml(x.result.title)} 기록 삭제">삭제</button></article>`).join('')}</div>`:`<div class="empty"><span>▤</span><h2>아직 저장한 이야기가 없어요</h2><p>마음에 남는 결과를 직접 저장하면<br>이곳에서 다시 읽을 수 있습니다.</p><button data-go="home" class="primary">이야기 둘러보기</button></div>`}<div class="notice"><strong>기록과 개인정보</strong><p>기록은 이 브라우저의 저장 공간에만 남습니다. 계정 동기화·암호화가 제공되지 않으므로 공용 기기에서는 저장하지 않는 것이 좋습니다.</p>${savedRecords.length?`<button class="danger-outline" data-action="clearRecords">저장한 기록 모두 삭제</button>`:''}</div>`;}
function settings(){return `${smallLabel('PREFERENCES')}<h1 class="plain-title">설정</h1><p class="lead">기록과 표시 기준을 관리할 수 있습니다.</p><div class="panel settings-panel"><h2>오늘의 날짜 기준</h2><p>오늘의 메시지는 선택한 지역의 날짜를 기준으로 표시됩니다.</p><label for="tz">시간대</label><select id="tz">${[['Asia/Seoul','대한민국 · 서울'],['Asia/Tokyo','일본 · 도쿄'],['Etc/UTC','협정 세계시'],['America/Los_Angeles','미국 · 로스앤젤레스']].map(([v,label])=>`<option value="${v}" ${state.timezone===v?'selected':''}>${label}</option>`).join('')}</select><div class="setting-row"><span>오늘 적용되는 날짜</span><strong>${escapeHtml(toDateKey(state.timezone))}</strong></div></div><div class="panel settings-panel"><h2>내 기록 보관</h2><p>자동으로 저장하지 않습니다. 저장 버튼을 누른 결과만 이 기기에 남습니다.</p><div class="setting-row"><span>저장한 기록</span><strong>${savedRecords.length}건</strong></div><div class="action-buttons"><button class="outline" data-go="records">기록 보러 가기</button><button class="danger-outline" data-action="clearRecords">전체 삭제</button></div></div><div class="panel settings-panel"><h2>운세담 소개</h2><p>다섯 가지 전통문화·자기성찰 콘텐츠를 회원가입, 광고, 외부 API 호출 없이 제공합니다.</p><div class="setting-row"><span>버전</span><strong>${V} · 체험판</strong></div><div class="setting-row"><span>계산 지원 연도</span><strong>1900~2049</strong></div><p class="muted">사주·꿈·타로·태몽은 미래 사건을 확정해 주지 않습니다. 사주의 달력 계산과 전통적 해석은 별개입니다. 앱스토어 등록·서버 동기화·유료 AI 분석은 제공하지 않습니다.</p></div>`;}
function confirmModal(){if(!state.modal)return '';const r=state.modal;return `<div class="modal-shade" data-action="closeModal"><div class="share-modal" role="dialog" aria-modal="true" aria-labelledby="shareTitle"><button class="modal-close" data-action="closeModal" aria-label="닫기">×</button>${smallLabel('SHARE PREVIEW')}<h2 id="shareTitle">공유하기 전 미리보기</h2><p class="modal-intro">생년월일, 이름, 꿈 원문, 타로 질문 등은 포함하지 않았습니다.</p><div class="share-card"><div class="share-mark">☾ 운세담</div><div class="share-type">${escapeHtml(SERVICE[r.type]?.name||'나의 이야기')}</div><h3>${escapeHtml(r.title)}</h3><p>${escapeHtml(r.summary)}</p><div class="share-foot">전통문화 · 자기성찰 콘텐츠 | unsedam</div></div><div class="action-buttons"><button class="primary" data-action="copyShare">문구 복사하기</button><button class="outline" data-action="nativeShare">공유하기</button></div><p class="modal-note">내용을 직접 확인한 뒤 복사 또는 공유를 눌러 주세요.</p></div></div>`;}
function render(){let body=state.screen==='result'?resultView():state.page==='home'?home():state.page==='saju'?sajuForm():state.page==='dream'?dreamForm('dream'):state.page==='taemong'?dreamForm('taemong'):state.page==='tarot'?tarot():state.page==='today'?today():state.page==='records'?recordList():settings();el.innerHTML=`<div class="site-wrap">${header()}<main id="content" class="content">${body}</main><footer class="site-footer"><strong>운세담</strong> <span>© 2026 운세담 · 나의 오늘을 읽다</span></footer>${footerNav()}</div>${confirmModal()}${state.toast?`<div class="toast" role="status">${escapeHtml(state.toast)}</div>`:''}`;}
function go(page){if(!['home','saju','dream','taemong','tarot','today','records','settings'].includes(page))return;state.page=page;state.screen='form';state.error='';state.modal=false;state.detailRecordId=null;render();window.scrollTo({top:0,behavior:'instant'});}
function readSajuForm(){const f=document.getElementById('sajuForm');const x=new FormData(f);for(const k of Object.keys(state.sajuForm)){state.sajuForm[k]=String(x.get(k)??(k==='lunarLeap'?'':state.sajuForm[k]));}return state.sajuForm;}
function cleanText(s,max=700){return String(s||'').trim().slice(0,max);}
function sajuSubmit(){const f=readSajuForm();const yy=Number(f.year),mm=Number(f.month),dd=Number(f.day),hasTime=f.timeMode==='known';if(!f.year||!f.month||!f.day)throw new RangeError('태어난 연도, 월, 일을 모두 입력해 주세요.');if(f.calendar==='lunar'&&!f.lunarLeap)throw new RangeError('음력 생일은 평달인지 윤달인지 선택해 주세요.');if(hasTime&&(f.hour===''||f.minute===''))throw new RangeError('출생 시각을 알고 있다면 시와 분을 입력해 주세요.');const result=E.calculateSaju({year:yy,month:mm,day:dd,calendar:f.calendar,leap:f.lunarLeap==='yes',knownTime:hasTime,hour:hasTime?Number(f.hour):null,minute:hasTime?Number(f.minute):null});const day=result.pillars.day;const meta=day?ELEMENT_META[E.STEM_ELEMENTS[day.stemIndex]]:null;const title=meta?`${day.text}일주의 이야기`:'절기 경계를 살펴볼 시간';const summary=meta?meta.summary:'출생 시각을 확인하면 조금 더 분명한 명식을 살펴볼 수 있습니다.';return {type:'saju',title,summary,method:'만세력 기반 · 기본 해석',meta:`양력 환산 ${result.solar.year}-${String(result.solar.month).padStart(2,'0')}-${String(result.solar.day).padStart(2,'0')} · ${hasTime?`${f.hour}시 ${f.minute}분`:'생시 미상'}`,action:meta?.action||'가족이나 기록에서 태어난 시각을 확인해 보세요.',sections:[{title:'성향을 돌아보는 관점',text:summary},{title:'관계에서 살펴볼 점',text:meta?.relation||'서로의 생각을 차분하게 나누는 시간을 가져 보세요.'},{title:'일과 공부',text:meta?.work||'지금 중요한 일을 한 가지 골라 실행해 보세요.'},{title:'돈 관리 습관',text:meta?.money||'지출과 목표를 구분해 보세요.'},{title:'생활의 균형',text:meta?.rhythm||'휴식 시간을 일과에 넣어 보세요.'}],extra:result};}
function dreamSubmit(key){const form=document.getElementById('dreamForm');const x=new FormData(form);const content=cleanText(x.get('content'));const emotion=cleanText(x.get('emotion'),20);if(!content||content.length<2)throw new RangeError('꿈 내용을 두 글자 이상 적어 주세요.');state[key==='dream'?'dreamForm':'taemongForm']={content,emotion};const found=DREAM_SYMBOLS.filter(item=>item.words.some(word=>content.includes(word))).slice(0,4);const baby=key==='taemong';const name=found.length?found.map(x=>x.name).join(' · '):'꿈속의 감정';const first=found[0];const sections=found.length?found.map(o=>({title:`${o.name}의 전통적 상징`,text:o.traditional})): [{title:'특정 상징이 감지되지 않았어요',text:'입력한 꿈에서 사전에 등록된 상징을 찾지 못했습니다. 아래 질문으로 기억과 감정을 돌아볼 수 있습니다.'}];sections.push({title:'꿈에서 느낀 마음',text:`꿈에서 느낀 감정은 ‘${emotion}’이라고 적으셨습니다. 꿈의 뜻은 한 가지로 정해지지 않으며, 그때 느낀 감정도 해석의 중요한 출발점이 될 수 있습니다.`});sections.push({title:baby?'가족에게 남길 이야기':'생각해 볼 질문',text:first?.question||'최근 마음에 오래 남은 장면이 있나요?'});if(baby)sections.push({title:'태몽을 기억하는 방법',text:'예언으로 단정하기보다 소중한 순간을 기억하고 가족과 이야기를 나누는 계기로 삼아 보세요. 꿈만으로 임신·태아 성별·건강은 알 수 없습니다.'});return {type:key,title:baby?`${name} 태몽 이야기`:`${name} 꿈 이야기`,summary:found.length?`꿈속에서 발견한 ${name}의 상징을 전통적 이야기와 함께 살펴봅니다.`:'특정 상징보다 꿈에서 느낀 감정과 일상의 상황을 중심으로 돌아봅니다.',method:'상징별 기본 해석 · AI 분석 아님',action:first?.action||'오늘 마음에 남은 생각을 한 문장으로 적어 보세요.',sections};}
function uniformRandom(max){if(globalThis.crypto?.getRandomValues){const a=new Uint32Array(1);const bound=0x100000000-Math.pow(2,32)%max;let v;do{crypto.getRandomValues(a);v=a[0];}while(v>=bound);return v%max;}return Math.floor(Math.random()*max);}
function drawTarot(count){const q=document.getElementById('tarotQuestion');state.tarotQuestion=cleanText(q?.value,120);const deck=Array.from({length:22},(_,i)=>i);for(let i=deck.length-1;i>0;i--){const j=uniformRandom(i+1);[deck[i],deck[j]]=[deck[j],deck[i]];}reading={id:goodId(),createdAt:new Date().toISOString(),question:state.tarotQuestion,cards:deck.slice(0,count).map(index=>({index,reversed:uniformRandom(2)===1})),revealed:[],version:'major22-1.0'};putJSON(sessionAvailable?sessionStorage:{setItem:()=>{}},SESSION_KEY,reading);render();}
function persistReading(){if(sessionAvailable)putJSON(sessionStorage,SESSION_KEY,reading);}
function tarotResult(){if(!reading)return null;const three=reading.cards.length===3;const info=reading.cards.map((c,i)=>tarotDetails(c,i,three));return {type:'tarot',title:info.map(x=>x.name).join(' · '),summary:`${info.map(x=>x.name).join(', ')} 카드가 보여주는 관점을 차분히 살펴보세요.`,method:'메이저 22장 · 무작위 뽑기',action:info[info.length-1].action,sections:info.map(x=>({title:`${x.position} · ${x.name} (${x.mode})`,text:`${x.interpret} ${x.action}`}))};}
function todayResult(){const {item}=todaysItem();return {type:'today',title:item.topic,summary:item.intro,method:'일반 메시지',action:item.action,sections:[{title:'관계',text:item.relation},{title:'일과 공부',text:item.work},{title:'돈 관리',text:item.money},{title:'생활 리듬',text:item.rhythm}]};}
function saveResult(r){if(!r)return;if(!storageAvailable){toast('이 브라우저에서는 기록 저장을 사용할 수 없습니다.');return;}const item={id:goodId(),savedAt:new Date().toISOString(),result:{...r}};savedRecords.unshift(item);savedRecords=savedRecords.slice(0,100);if(putJSON(localStorage,RECORD_KEY,savedRecords))toast('이 기기에 저장했습니다.');else{savedRecords.shift();toast('저장에 실패했습니다. 저장 공간을 확인해 주세요.');}}
function sharePreview(r){if(!r)return;state.modal={type:r.type,title:r.title,summary:r.summary};render();}
function shareText(){const r=state.modal;return `☾ 운세담 · ${SERVICE[r.type]?.name||'나의 이야기'}\n\n${r.title}\n${r.summary}\n\n전통문화·자기성찰 콘텐츠입니다.`;}
function buildHTML(){render();}
document.addEventListener('click',async(e)=>{
 const target=e.target.closest('button,a');if(!target)return;
 if(target.matches('a[href^="#"]'))e.preventDefault();
 if(target.dataset.go){go(target.dataset.go);return;}
 if(target.dataset.symbol){const textarea=document.getElementById('dreamContent');if(textarea){const sym=target.dataset.symbol;textarea.value=(textarea.value.trim()?textarea.value.trim()+' ':'')+sym+'이 나오는 꿈을 꾸었어요.';textarea.focus();}return;}
 if(target.dataset.draw){drawTarot(Number(target.dataset.draw));return;}
 if(target.dataset.reveal!==undefined){const i=Number(target.dataset.reveal);if(reading&&!reading.revealed.includes(i)){reading.revealed.push(i);persistReading();render();}return;}
 if(target.dataset.open){state.detailRecordId=target.dataset.open;render();window.scrollTo(0,0);return;}
 if(target.dataset.delete){if(window.confirm('선택한 기록을 이 기기에서 삭제할까요?')){savedRecords=savedRecords.filter(x=>x.id!==target.dataset.delete);if(storageAvailable)putJSON(localStorage,RECORD_KEY,savedRecords);state.detailRecordId=null;render();}return;}
 const a=target.dataset.action;if(!a)return;
 switch(a){
 case 'again':state.screen='form';state.result=null;state.error='';render();break;
 case 'newTarot':if(window.confirm('지금 카드를 내려놓고 새로 뽑을까요?')){reading=null;if(sessionAvailable)sessionStorage.removeItem(SESSION_KEY);render();}break;
 case 'revealAll':if(reading){reading.revealed=reading.cards.map((_,i)=>i);persistReading();render();}break;
 case 'tarotSave':saveResult(tarotResult());break;
 case 'tarotShare':sharePreview(tarotResult());break;
 case 'todaySave':saveResult(todayResult());break;
 case 'todayShare':sharePreview(todayResult());break;
 case 'saveResult':saveResult(state.result);break;
 case 'shareResult':sharePreview(state.result);break;
 case 'recordShare':{const r=savedRecords.find(x=>x.id===state.detailRecordId);if(r)sharePreview(r.result);}break;
 case 'backRecords':state.detailRecordId=null;render();break;
 case 'clearRecords':if(savedRecords.length&&window.confirm('이 기기에 저장한 모든 기록을 삭제할까요? 되돌릴 수 없습니다.')){savedRecords=[];if(storageAvailable)localStorage.removeItem(RECORD_KEY);state.detailRecordId=null;toast('저장한 기록을 모두 삭제했습니다.');}break;
 case 'closeModal':state.modal=false;render();break;
 case 'copyShare':try{await navigator.clipboard.writeText(shareText());toast('개인정보를 제외한 문구를 복사했습니다.');}catch{try{const textarea=document.createElement('textarea');textarea.value=shareText();document.body.append(textarea);textarea.select();document.execCommand('copy');textarea.remove();toast('문구를 복사했습니다.');}catch{toast('복사 기능을 지원하지 않습니다.');}}break;
 case 'nativeShare':try{if(navigator.share){await navigator.share({title:'운세담',text:shareText()});}else{await navigator.clipboard.writeText(shareText());toast('공유 기능이 없어 문구를 복사했습니다.');}}catch(err){if(err?.name!=='AbortError')toast('공유가 완료되지 않았습니다.');}break;
 }
});
document.addEventListener('submit',(e)=>{const form=e.target;if(form.id!=='sajuForm'&&form.id!=='dreamForm')return;e.preventDefault();try{state.error='';let r;if(form.id==='sajuForm')r=sajuSubmit();else r=dreamSubmit(state.page);state.result=r;state.screen='result';render();window.scrollTo({top:0,behavior:'instant'});}catch(err){state.error=err?.message||'입력을 확인해 주세요.';if(form.id==='dreamForm'){state[state.page==='dream'?'dreamForm':'taemongForm']={content:document.getElementById('dreamContent').value,emotion:document.getElementById('dreamEmotion').value};}render();const error=document.querySelector('.error');error?.scrollIntoView({block:'center',behavior:'smooth'});}});
document.addEventListener('change',(e)=>{if(['birthCalendar','timeMode'].includes(e.target.id)){readSajuForm();state.error='';render();}if(e.target.id==='tz'){state.timezone=e.target.value;if(storageAvailable)putJSON(localStorage,TZ_KEY,state.timezone);render();}});
window.addEventListener('pageshow',()=>{if(state.page==='today'&&state.screen==='form')render();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.page==='today'&&state.screen==='form')render();});
document.addEventListener('keydown',(e)=>{if(e.key==='Escape'&&state.modal){state.modal=false;render();}});
buildHTML();
})();

</script>

</body></html>
